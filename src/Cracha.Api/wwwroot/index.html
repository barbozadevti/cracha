<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crachá</title>
  <meta name="description" content="Crachá: sistema de RH com cadastro de funcionários, organograma, férias, painel e histórico de alterações.">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/estilo.css">
  <script src="js/tema.js"></script>
</head>
<body class="carregando-sessao">

  <!-- ===== Login ===== -->
  <section id="login" class="login" hidden>
    <div class="login-cartao">
      <div class="login-marca"><img src="favicon.svg" alt="" width="44" height="44"><span>Crachá</span></div>
      <p class="login-texto">Sistema de RH: pessoas, organograma, férias e histórico de cada alteração.</p>
      <form id="formLogin" novalidate>
        <label class="campo">E-mail
          <input name="email" type="email" autocomplete="username" required>
        </label>
        <label class="campo">Senha
          <input name="senha" type="password" autocomplete="current-password" required>
        </label>
        <p class="erro geral" id="erroLogin" role="alert"></p>
        <button class="botao primario largo" type="submit">Entrar</button>
      </form>
      <div id="contasDemo" class="contas-demo" hidden>
        <p>Contas de demonstração <small>(senha <code id="senhaDemo">Cracha@2026</code>)</small></p>
        <div id="listaContasDemo"></div>
      </div>
    </div>
  </section>

  <!-- ===== Aplicação ===== -->
  <aside class="lateral" id="lateral" hidden>
    <a class="marca" href="#/">
      <img src="favicon.svg" alt="" width="30" height="30">
      <span>Crachá</span>
    </a>
    <nav class="menu" id="menu" aria-label="Principal"></nav>
    <button class="botao primario novo" id="novoFuncionario" type="button" hidden>+ Novo funcionário</button>
    <button class="busca-rapida" id="abrirPaleta" type="button"><span>🔎 Buscar pessoa</span><kbd>Ctrl K</kbd></button>
    <div class="rodape-lateral">
      <div class="eu" id="eu"></div>
      <div class="acoes-conta">
        <button type="button" class="link" id="alternarTema" title="Alternar tema claro/escuro">🌓 Tema</button>
        <button type="button" class="link" id="trocarSenha">🔑 Senha</button>
        <button type="button" class="link" id="sair">↩ Sair</button>
      </div>
      <p class="sistema" id="sistema" title="Onde os dados estão sendo gravados"></p>
      <p class="links-tecnicos"><a href="/swagger" target="_blank" rel="noopener">API ↗</a> · <a href="/health" target="_blank" rel="noopener">Saúde ↗</a></p>
    </div>
  </aside>

  <main id="app" class="conteudo" tabindex="-1" hidden></main>

  <!-- ===== Funcionário ===== -->
  <dialog id="modal" class="modal" aria-labelledby="modalTitulo">
    <form id="formFuncionario" method="dialog" novalidate>
      <header>
        <h2 id="modalTitulo">Novo funcionário</h2>
        <button class="fechar" type="button" data-fechar aria-label="Fechar">×</button>
      </header>
      <label class="campo">Nome completo
        <input name="nome" maxlength="100" required autocomplete="off">
        <span class="erro" data-erro="nome"></span>
      </label>
      <div class="linha">
        <label class="campo">Cargo
          <input name="cargo" maxlength="60" required autocomplete="off" list="cargos">
          <datalist id="cargos"></datalist>
          <span class="erro" data-erro="cargo"></span>
        </label>
        <label class="campo">Departamento
          <select name="departamentoId" required></select>
          <span class="erro" data-erro="departamentoId"></span>
        </label>
      </div>
      <label class="campo">Gestor imediato
        <select name="gestorId"></select>
        <span class="erro" data-erro="gestorId"></span>
      </label>
      <div class="linha">
        <label class="campo">E-mail profissional
          <input name="emailProfissional" type="email" maxlength="120" required autocomplete="off">
          <span class="erro" data-erro="emailProfissional"></span>
        </label>
        <label class="campo curto">Ramal
          <input name="ramal" inputmode="numeric" maxlength="4" pattern="\d{4}" required autocomplete="off" placeholder="0000">
          <span class="erro" data-erro="ramal"></span>
        </label>
      </div>
      <label class="campo">Endereço
        <input name="endereco" maxlength="200" autocomplete="off" placeholder="Rua, número - cidade/UF (opcional)">
        <span class="erro" data-erro="endereco"></span>
      </label>
      <div class="linha">
        <label class="campo">Salário (R$)
          <input name="salario" type="number" min="0.01" step="0.01" required>
          <span class="erro" data-erro="salario"></span>
        </label>
        <label class="campo">Admissão
          <input name="dataAdmissao" type="date" required>
          <span class="erro" data-erro="dataAdmissao"></span>
        </label>
      </div>
      <p class="erro geral" data-erro="geral"></p>
      <footer>
        <button class="botao" type="button" data-fechar>Cancelar</button>
        <button class="botao primario" type="submit">Salvar</button>
      </footer>
    </form>
  </dialog>

  <!-- ===== Ausência ===== -->
  <dialog id="modalAusencia" class="modal" aria-labelledby="ausenciaTitulo">
    <form id="formAusencia" method="dialog" novalidate>
      <header>
        <h2 id="ausenciaTitulo">Pedir férias ou folga</h2>
        <button class="fechar" type="button" data-fechar aria-label="Fechar">×</button>
      </header>
      <label class="campo" id="campoPessoa" hidden>Pessoa
        <select name="funcionarioId"></select>
        <span class="erro" data-erro="funcionarioId"></span>
      </label>
      <label class="campo">Tipo
        <select name="tipo">
          <option value="Ferias">Férias</option>
          <option value="Folga">Folga</option>
          <option value="Licenca" data-rh>Licença</option>
          <option value="Atestado" data-rh>Atestado</option>
        </select>
      </label>
      <div class="linha">
        <label class="campo">Início
          <input name="inicio" type="date" required>
          <span class="erro" data-erro="inicio"></span>
        </label>
        <label class="campo">Fim
          <input name="fim" type="date" required>
          <span class="erro" data-erro="fim"></span>
        </label>
      </div>
      <p class="dica" id="diasAusencia"></p>
      <label class="campo">Observação
        <input name="observacao" maxlength="300" autocomplete="off" placeholder="Opcional">
      </label>
      <p class="erro geral" data-erro="geral"></p>
      <footer>
        <button class="botao" type="button" data-fechar>Cancelar</button>
        <button class="botao primario" type="submit">Enviar pedido</button>
      </footer>
    </form>
  </dialog>

  <!-- ===== Acesso ===== -->
  <dialog id="modalUsuario" class="modal" aria-labelledby="usuarioTitulo">
    <form id="formUsuario" method="dialog" novalidate>
      <header>
        <h2 id="usuarioTitulo">Novo acesso</h2>
        <button class="fechar" type="button" data-fechar aria-label="Fechar">×</button>
      </header>
      <label class="campo">Funcionário
        <select name="funcionarioId"></select>
        <span class="erro" data-erro="funcionarioId"></span>
      </label>
      <div class="linha">
        <label class="campo">Nome
          <input name="nome" maxlength="100" required autocomplete="off">
          <span class="erro" data-erro="nome"></span>
        </label>
        <label class="campo">E-mail de acesso
          <input name="email" type="email" maxlength="120" required autocomplete="off">
          <span class="erro" data-erro="email"></span>
        </label>
      </div>
      <div class="linha">
        <label class="campo">Perfil
          <select name="perfil">
            <option value="Colaborador">Colaborador</option>
            <option value="Gestor">Gestor</option>
            <option value="RH">RH</option>
            <option value="Administrador">Administrador</option>
          </select>
        </label>
        <label class="campo">Senha <small id="dicaSenha"></small>
          <input name="senha" type="password" autocomplete="new-password">
          <span class="erro" data-erro="senha"></span>
        </label>
      </div>
      <label class="marcar"><input type="checkbox" name="ativo" checked> Acesso ativo</label>
      <p class="erro geral" data-erro="geral"></p>
      <footer>
        <button class="botao" type="button" data-fechar>Cancelar</button>
        <button class="botao primario" type="submit">Salvar</button>
      </footer>
    </form>
  </dialog>

  <!-- ===== Senha ===== -->
  <dialog id="modalSenha" class="modal pequeno" aria-labelledby="senhaTitulo">
    <form id="formSenha" method="dialog" novalidate>
      <header>
        <h2 id="senhaTitulo">Trocar senha</h2>
        <button class="fechar" type="button" data-fechar aria-label="Fechar">×</button>
      </header>
      <label class="campo">Senha atual
        <input name="atual" type="password" autocomplete="current-password" required>
        <span class="erro" data-erro="atual"></span>
      </label>
      <label class="campo">Nova senha <small>8+ caracteres, letras e números</small>
        <input name="nova" type="password" autocomplete="new-password" required>
        <span class="erro" data-erro="nova"></span>
      </label>
      <p class="erro geral" data-erro="geral"></p>
      <footer>
        <button class="botao" type="button" data-fechar>Cancelar</button>
        <button class="botao primario" type="submit">Trocar</button>
      </footer>
    </form>
  </dialog>

  <!-- ===== Confirmação ===== -->
  <dialog id="confirmacao" class="modal pequeno" aria-labelledby="confirmacaoTitulo">
    <form method="dialog">
      <header><h2 id="confirmacaoTitulo">Confirmar</h2></header>
      <p id="confirmacaoTexto"></p>
      <label class="campo" id="confirmacaoData" hidden>Data do desligamento
        <input type="date" name="data">
      </label>
      <label class="campo" id="confirmacaoMotivo" hidden>Motivo
        <input name="motivo" maxlength="300" autocomplete="off">
      </label>
      <footer>
        <button class="botao" value="nao">Cancelar</button>
        <button class="botao perigo" value="sim" id="confirmacaoOk">Confirmar</button>
      </footer>
    </form>
  </dialog>

  <!-- ===== Busca rápida (Ctrl+K) ===== -->
  <dialog id="paleta" class="paleta" aria-label="Busca rápida">
    <input id="paletaBusca" type="search" placeholder="Nome, cargo, ramal ou e-mail…" autocomplete="off" aria-label="Buscar pessoa">
    <ul id="paletaResultados" role="listbox"></ul>
    <p class="paleta-dica"><kbd>↑</kbd><kbd>↓</kbd> navegar · <kbd>Enter</kbd> abrir · <kbd>Esc</kbd> fechar</p>
  </dialog>

  <input type="file" id="arquivoFoto" accept="image/jpeg,image/png,image/webp" hidden>
  <div id="aviso" class="aviso" role="status" aria-live="polite"></div>

  <script src="js/app.js"></script>
</body>
</html>
